[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "excavator-il"
version = "0.1.0"
description = "Excavator demonstration validation and LeRobot ACT dataset tooling"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
collector = [
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10",
    "pyserial>=3.5,<4",
]
teleop = ["pygame>=2.5,<3"]
training = [
    "lerobot @ git+https://github.com/freshmakerzhao/lerobot.git@12b88fce029cc3a8a94b061cd9e790018873c769",
    "numpy>=1.26,<3",
    "Pillow>=10",
]
test = ["pytest>=8", "pytest-cov>=6", "numpy>=1.26,<3", "Pillow>=10"]

[project.scripts]
excavator-il = "excavator_il.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
